[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-intelligence"
version = "0.1.0"
description = "Research alerts for investors who earn, save, and invest across currencies."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Expat Investment Intelligence contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
investment-intelligence = "investment_intelligence.__main__:main"

[project.urls]
Homepage = "https://github.com/desmond-netizen/expat-investment-intelligence"
Issues = "https://github.com/desmond-netizen/expat-investment-intelligence/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
